"use strict";

// physics
/** Grandezas em SI, exceto quando uma função especifica outra unidade. */
const R = 8.31;
const ATM = 101325;
function positive(x, name = 'grandeza') {
  if (!Number.isFinite(x) || x <= 0) throw new RangeError(`${name} deve ser positiva e finita.`);

/** @param {{P?:number,V?:number,n?:number,T?:number}} state @param {'P'|'V'|'n'|'T'} target */
function idealSolve(state, target) {
  const equations = {P: () => state.n * R * state.T / state.V,
    V: () => state.n * R * state.T / state.P,
    n: () => state.P * state.V / (R * state.T),
    T: () => state.P * state.V / (state.n * R)};
  if (!equations[target]) throw new Error('Incógnita inválida.');
  Object.keys(equations).filter(k=>k!==target).forEach(k=>positive(state[k],k));
  return positive(equations[target](), target);
}
const isothermal = (p1,v1,v2) => positive(p1)*positive(v1)/positive(v2);
const isobaric = (v1,t1,t2) => positive(v1)*positive(t2)/positive(t1);
const isochoric = (p1,t1,t2) => positive(p1)*positive(t2)/positive(t1);

const physicsRawNumberFormat = new Intl.NumberFormat('en-US',{maximumFractionDigits:2,useGrouping:false});

function roundForDisplay(x) {

function fmt(x) {

}
/** Aceita vírgula, ponto, e, ×10^ e unidades reconhecidas. Não executa expressões. */
function parseNumber(input, expectedUnit='') {

  }

function numericTolerance(answer) {

 {id:'isochor',name:'Transformação isocórica',short:'Isocórica',equation:'P₁/T₁ = P₂/T₂',math:'<mfrac><msub><mi>P</mi><mn>1</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi>P</mi><mn>2</mn></msub><msub><mi>T</mi><mn>2</mn></msub></mfrac>',module:2,family:'isochor',constant:'Volume e quantidade de gás',cue:'Recipiente rígido, fechado e sem vazamento; volume constante.',symbols:'P: pressão absoluta (Pa ou atm). T: temperatura absoluta (K).',valid:'Amostra fixa de gás ideal em volume constante. Use Kelvin e pressões na mesma unidade.',why:'As partículas mais quentes se movem, em média, mais rapidamente e transferem mais quantidade de movimento às paredes. Com n e V fixos, P é proporcional a T.',isolate:['P₂ = P₁T₂/T₁','T₂ = T₁P₂/P₁','P₁ = P₂T₁/T₂','T₁ = T₂P₁/P₂'],errors:['Calcular trabalho de expansão em um recipiente que não muda de volume.','Confundir recipiente fechado com recipiente rígido: fechado significa sem troca de matéria.'],locus:'Turbina branca',memory:'Uma caixa branca de aço fica imóvel. Dentro dela, um termômetro e um manômetro sobem juntos como dois elevadores.',tokens:['P₁','/','T₁','=','P₂','/','T₂']},
 {id:'general',name:'Lei geral dos gases',short:'Lei geral',equation:'P₁V₁/T₁ = P₂V₂/T₂',math:'<mfrac><mrow><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mrow><msub><mi>T</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub></mrow><msub><mi>T</mi><mn>2</mn></msub></mfrac>',module:2,family:'general',constant:'Quantidade de gás',cue:'Comparação de dois estados de uma mesma amostra, com pressão, volume e temperatura variando.',symbols:'P: pressão absoluta. V: volume. T: temperatura em K. Unidades de P e de V consistentes entre estados.',valid:'Gás ideal com n constante. Também vale para as transformações especiais: basta cancelar a grandeza constante.',why:'Dividir PV = nRT por T dá PV/T = nR. Uma mesma amostra tem o mesmo valor nR em ambos os estados.',isolate:['P₂ = P₁V₁T₂/(T₁V₂)','V₂ = P₁V₁T₂/(T₁P₂)','T₂ = P₂V₂T₁/(P₁V₁)','P₁ = P₂V₂T₁/(T₂V₁)','V₁ = P₂V₂T₁/(T₂P₁)','T₁ = P₁V₁T₂/(P₂V₂)'],errors:['Usar a lei para um reservatório que perde gás sem levar a mudança de n em conta.','Misturar dados do estado 1 com os do estado 2.'],locus:'Torre meteorológica',memory:'Na torre há dois andares. Em cada um, pressão e volume ficam em cima de um termômetro. Uma ponte de igualdade une os andares.',tokens:['P₁','V₁','/','T₁','=','P₂','V₂','/','T₂']},
 {id:'work',name:'Trabalho sob pressão constante',short:'Trabalho PΔV',equation:'W = P(Vf − Vi)',math:'<mi>W</mi><mo>=</mo><mi>P</mi><mo>(</mo><msub><mi>V</mi><mi>f</mi></msub><mo>−</mo><msub><mi>V</mi><mi>i</mi></msub><mo>)</mo>',module:3,family:'work',constant:'Pressão durante o processo',cue:'Expansão ou compressão sob pressão constante, com volumes inicial e final conhecidos.',symbols:'W: trabalho pelo gás (J). P: pressão (Pa). V: volume (m³). 1 Pa·m³ = 1 J.',valid:'Trabalho de fronteira em processo quase-estático isobárico. Para pressão variável, use W = ∫P dV. Em processos não quase-estáticos, o trabalho de fronteira usa a pressão externa apropriada.',why:'A força do gás desloca o êmbolo. Força = pressão × área e variação de volume = área × deslocamento. Assim W = PΔV.',isolate:['P = W/(Vf − Vi), se ΔV ≠ 0','Vf = Vi + W/P','Vi = Vf − W/P','ΔV = W/P'],errors:['Esquecer converter L para m³ quando P está em Pa.','Trocar Vf − Vi por Vi − Vf.','Usar PΔV com pressão variável sem justificar uma pressão média.'],locus:'Pistão mecânico',memory:'Um pistão carimba um W. Sua alavanca é uma letra P que empurra dois recipientes: o final menos o inicial.',tokens:['W','=','P','(','Vf','−','Vi',')']},
 {id:'internal',name:'Energia interna monoatômica',short:'Energia interna',equation:'U = (3/2)nRT',math:'<mi>U</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>n</mi><mi>R</mi><mi>T</mi>',module:4,family:'internal',constant:'Modelo de gás ideal monoatômico',cue:'Pede a energia interna de uma amostra em um único estado.',symbols:'U: energia interna (J). n: quantidade (mol). R = 8,31 J/(mol·K). T: temperatura (K).',valid:'Gás ideal monoatômico no modelo clássico adotado. O fator 3/2 não se aplica indistintamente a moléculas diatômicas ou gases reais.',why:'Cada átomo possui três direções de movimento translacional. A energia cinética microscópica total é proporcional à quantidade de matéria e à temperatura absoluta.',isolate:['n = 2U/(3RT)','T = 2U/(3nR)'],errors:['Substituir T em Celsius.','Usar ΔT quando a questão pede a energia de um estado.','Usar 3/2 para qualquer tipo de gás.'],locus:'Núcleo energético',memory:'No núcleo, três átomos dividem dois bancos. Eles seguram as letras n, R e um termômetro T, iluminando um enorme U.',tokens:['U','=','3/2','n','R','T']},
 {id:'deltaU',name:'Variação da energia interna',short:'Variação de U',equation:'ΔU = (3/2)nRΔT',math:'<mi>ΔU</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>n</mi><mi>R</mi><mi>ΔT</mi>',module:4,family:'deltaU',constant:'Quantidade fixa de gás ideal monoatômico',cue:'Pede quanto a energia interna aumentou ou diminuiu entre dois estados.',symbols:'ΔU: variação (J). ΔT = Tf − Ti (K ou diferença em °C). n: mol. R = 8,31 J/(mol·K).',valid:'Quantidade fixa de gás ideal monoatômico. Diferenças em Kelvin e Celsius têm o mesmo valor numérico; temperaturas absolutas não.',why:'Subtraia Ui de Uf: ΔU = (3/2)nR(Tf − Ti). Aquecimento dá ΔU > 0; resfriamento dá ΔU < 0; isotérmica dá ΔU = 0.',isolate:['ΔT = 2ΔU/(3nR)','n = 2ΔU/(3RΔT), se ΔT ≠ 0','Tf = Ti + 2ΔU/(3nR)'],errors:['Usar a temperatura final no lugar da variação.','Somar 273,15 a uma diferença de temperaturas.','Interpretar ΔU negativo como uma energia interna absoluta negativa no modelo.'],locus:'Termômetro luminoso',memory:'Dois termômetros se subtraem e formam um triângulo Δ. O brilho do núcleo muda somente conforme a diferença entre eles.',tokens:['ΔU','=','3/2','n','R','ΔT']},
 {id:'first',name:'Primeira lei da Termodinâmica',short:'Primeira lei',equation:'ΔU = Q − W',math:'<mi>ΔU</mi><mo>=</mo><mi>Q</mi><mo>−</mo><mi>W</mi>',module:5,family:'first',constant:'Conservação de energia; sistema fechado',cue:'O enunciado fala de calor, trabalho e energia interna.',symbols:'Q: calor recebido pelo sistema (J). W: trabalho realizado pelo sistema (J). ΔU: variação interna (J).',valid:'Sistema fechado, com variações de energia cinética e potencial macroscópicas desprezíveis; o trabalho considerado é o trabalho total relevante.',why:'A energia que entra como calor pode ficar armazenada ou sair como trabalho. A convenção escolhida é W > 0 quando o gás trabalha sobre o ambiente.',isolate:['Q = ΔU + W','W = Q − ΔU'],errors:['Somar W a Q sem considerar a convenção.','Considerar todo calor como positivo.','Confundir calor, transferência de energia, com energia armazenada.'],locus:'Central de energia',memory:'Na central, um caminhão Q entrega energia. Um guindaste W retira parte. O estoque que sobra muda de quantidade: ΔU = Q − W.',tokens:['ΔU','=','Q','−','W']},
 {id:'workT',name:'Trabalho isobárico de gás ideal',short:'Trabalho nRΔT',equation:'W = nRΔT',math:'<mi>W</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>ΔT</mi>',module:3,family:'workT',constant:'Pressão e quantidade fixa de gás ideal',cue:'Processo isobárico com quantidade de matéria e mudança de temperatura conhecidas.',symbols:'W: J. n: mol. R = 8,31 J/(mol·K). ΔT = Tf − Ti.',valid:'Amostra fixa de gás ideal em transformação isobárica quase-estática. Não exige gás monoatômico.',why:'Em pressão constante, PVf − PVi = nRTf − nRTi. Logo PΔV = nRΔT. Como W = PΔV, W = nRΔT.',isolate:['n = W/(RΔT), se ΔT ≠ 0','ΔT = W/(nR)','Tf = Ti + W/(nR)'],errors:['Aplicar essa fórmula a um processo isocórico.','Exigir que o gás seja monoatômico: essa restrição pertence ao fator 3/2 de U.'],locus:'Gerador térmico',memory:'Um gerador transforma as letras n, R e a mudança do termômetro em uma engrenagem W. O manômetro permanece travado.',tokens:['W','=','n','R','ΔT']},
 {id:'ideal',name:'Equação de estado do gás ideal',short:'Gás ideal',equation:'PV = nRT',module:1,family:'ideal',constant:'R, constante universal',cue:'Relaciona um único estado e inclui quantidade de matéria.',symbols:'P: Pa absoluto. V: m³. n: mol. R = 8,31 J/(mol·K). T: K.',valid:'Modelo de gás ideal, boa aproximação para muitos gases diluídos longe da condensação. Com R em SI, converta P e V ao SI.',why:'É a relação entre as variáveis de estado. As leis especiais comparam estados da mesma amostra.',isolate:['P = nRT/V','V = nRT/P','n = PV/(RT)','T = PV/(nR)'],errors:['Usar atm e L com R = 8,31 sem converter.','Usar pressão manométrica no lugar de pressão absoluta.']},
 {id:'kelvin',name:'Conversão Celsius–Kelvin',short:'Temperatura',equation:'T(K) = T(°C) + 273,15',module:1,family:'units',constant:'Tamanho do intervalo: 1 K = 1 °C de variação',cue:'Uma temperatura está em °C e será usada em uma razão ou na equação de estado.',symbols:'T(K): temperatura absoluta. T(°C): escala Celsius. Kelvin não recebe o símbolo °.',valid:'Conversão entre as escalas. Pode-se usar +273 quando o exercício declarar a aproximação.',why:'As escalas possuem a mesma unidade de intervalo e origens diferentes. O zero absoluto é −273,15 °C.',isolate:['T(°C) = T(K) − 273,15'],errors:['Somar 273,15 a ΔT.','Usar +273 sem observar a aproximação informada.']},

const MAIN_FORMULAS = FORMULAS.slice(0,9);
const formulaById = id => FORMULAS.find(f=>f.id===id)||FORMULAS[0];
const MODULES = [
 {id:1,title:'Fundamentos dos gases',label:'01 / O ponto de partida',time:'12 min',description:'Dê significado a cada grandeza antes de fazer a primeira conta.',formulaIds:['ideal','kelvin'],sections:[
 ['Um gás ocupa o espaço disponível','O volume de uma amostra gasosa é o volume do recipiente que ela ocupa. Na expansão, o volume aumenta. Na compressão, diminui. Em um recipiente fechado, a matéria não escapa; em um recipiente rígido, o volume não muda. São condições diferentes.'],
 ['Pressão: colisões que fazem força','Partículas atingem as paredes e transferem quantidade de movimento. A pressão mede força por área: P = F/A. A unidade SI é pascal, Pa = N/m². Nas leis dos gases usamos pressão absoluta. Uma leitura manométrica mede a diferença em relação à pressão ambiente, e precisa ser ajustada quando necessário.'],
 ['Temperatura não é calor','Temperatura está ligada à energia cinética média de translação das partículas. Calor é energia transferida por diferença de temperatura. Para comparar temperaturas por razões, use a escala absoluta: 300 K é o dobro de 150 K, mas 30 °C não representa o dobro da energia cinética média de 15 °C.'],
 ['Quantidade de matéria','n mede a quantidade de matéria em mol. Um mol contém aproximadamente 6,02 × 10²³ entidades. Ao acrescentar gás, mudamos n; as leis de comparação que pressupõem a mesma amostra deixam de poder cancelar essa quantidade.'],
 ['O mapa das unidades','1 atm = 101325 Pa. 1 L = 1 × 10⁻³ m³. 1 m³ = 1000 L. T(K) = T(°C) + 273,15. No AERION, R = 8,31 J/(mol·K). Com esse R, trabalhe com Pa, m³, mol e K.'],
 ['Equação de estado','PV = nRT relaciona as quatro variáveis. Se P = 100000 Pa, V = 24,93 × 10⁻³ m³ e T = 300 K, então n = PV/(RT) = 1 mol. Sempre confira se o resultado tem unidade e ordem de grandeza plausíveis.']
 ],example:'Uma amostra a 26,85 °C está a 300 K. Se ocupa 2 L, seu volume em SI é 2 × 10⁻³ m³. Temperatura e volume agora podem entrar em PV = nRT.',pitfall:'Use Kelvin em temperaturas absolutas. Não some 273,15 a uma variação de temperatura.'},
 {id:2,title:'Transformações gasosas',label:'02 / Reconheça o que permanece',time:'18 min',description:'Uma grandeza constante transforma um problema em uma relação simples.',formulaIds:['iso','isobar','isochor','general'],sections:[
 ['A pergunta que vem antes da fórmula','Procure primeiro a grandeza constante e verifique se a quantidade de gás é fixa. Organize mentalmente os estados 1 e 2: pressão, volume e temperatura. Só então selecione a expressão.'],
 ['Isotérmica: T constante','P₁V₁ = P₂V₂. Pressão e volume variam inversamente. Em P × V, a curva é uma hipérbole. Exemplo: 2 atm × 4 L = P₂ × 1,6 L; portanto P₂ = 5 atm. A compressão aumenta a pressão.'],
 ['Isobárica: P constante','V₁/T₁ = V₂/T₂. Volume e temperatura absoluta são diretamente proporcionais. No gráfico V × T em Kelvin, a reta extrapolada passa pela origem do modelo ideal. Exemplo: 3 L a 300 K tornam-se 4,5 L a 450 K.'],
 ['Isocórica: V constante','P₁/T₁ = P₂/T₂. Em uma caixa rígida e fechada, aquecer aumenta a pressão. Exemplo: 2 atm a 300 K tornam-se 3 atm a 450 K. O gráfico P × T é uma reta; em P × V, a trajetória é vertical. Como não há deslocamento de fronteira, W = 0.'],
 ['Lei geral: n constante','P₁V₁/T₁ = P₂V₂/T₂. Serve mesmo quando nenhuma das três variáveis de estado fica constante. Se T, P ou V permanecer constante, a lei geral se simplifica na lei especial correspondente. Não se trata de uma lei exclusiva de processos com todas as grandezas variando.'],
 ['Isole antes de substituir','Para pressão final: P₂ = P₁V₁T₂/(T₁V₂). Para temperatura final: T₂ = P₂V₂T₁/(P₁V₁). Você pode cancelar fatores comuns antes de multiplicar. Se a temperatura dobra e o volume também dobra, a pressão permanece igual para a mesma amostra.']
 ],example:'P₁ = 2 atm, V₁ = 3 L, T₁ = 300 K, V₂ = 2 L, T₂ = 400 K. P₂ = (2 × 3 × 400)/(300 × 2) = 4 atm.',pitfall:'“Fechado” não significa “volume constante”. Procure a palavra rígido ou uma afirmação equivalente.'},
 {id:3,title:'Trabalho de um gás',label:'03 / Energia em movimento',time:'14 min',description:'Relacione o deslocamento do pistão ao sinal e ao valor do trabalho.',formulaIds:['work','workT','deltaV'],sections:[
 ['Quem faz trabalho sobre quem?','Adotamos W positivo quando o gás realiza trabalho sobre o ambiente. Em expansão contra pressão positiva, W > 0. Em compressão, o ambiente realiza trabalho sobre o gás, e W < 0.'],
 ['Pressão constante','W = P(Vf − Vi). Com P em Pa e V em m³, o trabalho sai em J. Exemplo: P = 200000 Pa, Vi = 2 L e Vf = 5 L: ΔV = 3 × 10⁻³ m³ e W = 600 J. Na trajetória inversa, W = −600 J.'],
 ['Recipiente rígido','Se Vf = Vi, ΔV = 0 e o trabalho de expansão/compressão é zero. Isso não impede calor ou variação de energia interna. Outros tipos de trabalho, se existirem, precisam ser contabilizados separadamente.'],
 ['Área no gráfico P × V','Para um processo quase-estático, W = ∫P dV. A expansão percorre V crescente e dá área algébrica positiva; a compressão dá área negativa. Uma isobárica forma um retângulo. Uma curva de pressão variável não pode ser substituída arbitrariamente por um retângulo.'],
 ['Use a temperatura quando for mais simples','Para n fixo e P constante, PV = nRT dá PΔV = nRΔT. Assim W = nRΔT. Com 2 mol aquecidos de 300 K a 350 K: W = 2 × 8,31 × 50 = 831 J. Essa relação não exige gás monoatômico.'],
 ['Além do retângulo','Na isotérmica quase-estática de gás ideal, integrar P = nRT/V dá W = nRT ln(Vf/Vi). Em uma trajetória reta no gráfico P × V, a área é um trapézio: W = (Pi + Pf)ΔV/2. O laboratório indica qual trajetória está sendo usada.']
 ],example:'Uma compressão de 6 L para 2 L sob 100000 Pa tem ΔV = −4 × 10⁻³ m³ e W = −400 J. O sinal faz parte da resposta.',pitfall:'PΔV só vale diretamente quando a pressão se mantém constante ao longo do processo.'},
 {id:4,title:'Energia interna',label:'04 / O universo microscópico',time:'12 min',description:'Veja como o movimento invisível das partículas se liga à temperatura.',formulaIds:['internal','deltaU','deltaT'],sections:[
 ['Energia microscópica','Energia interna é a energia associada aos graus de liberdade microscópicos do sistema. No modelo de gás ideal monoatômico clássico, consideramos a energia cinética de translação de seus átomos. Não é a energia do movimento do recipiente como um todo.'],
 ['Uma fotografia do estado','U = (3/2)nRT calcula a energia interna no modelo adotado. Para 1 mol a 300 K: U = 1,5 × 1 × 8,31 × 300 = 3739,5 J. O fator 3/2 vem das três direções de translação.'],
 ['A mudança entre duas fotografias','ΔU = Uf − Ui = (3/2)nR(Tf − Ti), para n fixo. Aquecer de 300 K a 400 K dá ΔT = 100 K. Para 1 mol, ΔU = 1246,5 J. Não confunda esse aumento com a energia total final.'],
 ['Só depende da temperatura, para n fixo','Em um gás ideal, a energia interna depende da temperatura e da quantidade/tipo de gás. Para uma amostra fixa, na isotérmica ΔU = 0. Em um ciclo completo, o estado final coincide com o inicial, então a variação total também é zero.'],
 ['Limites do modelo','Gases diatômicos podem armazenar energia em rotação e, conforme a temperatura, vibração. Gases reais também podem ter contribuições de interação. Por isso o fator 3/2 não é universal. As questões que o usam especificam gás ideal monoatômico.']
 ],example:'Resfriar 2 mol de gás ideal monoatômico de 400 K a 350 K dá ΔU = 1,5 × 2 × 8,31 × (−50) = −1246,5 J.',pitfall:'U descreve um estado; ΔU descreve uma mudança. Uma diferença de 50 °C tem o mesmo tamanho que uma diferença de 50 K.'},
 {id:5,title:'Primeira lei da Termodinâmica',label:'05 / O balanço da energia',time:'16 min',description:'Entenda como calor e trabalho alteram a energia armazenada.',formulaIds:['first'],sections:[
 ['Conservação de energia','ΔU = Q − W. Neste curso, Q > 0 se o gás recebe calor e Q < 0 se cede calor. W > 0 se ele realiza trabalho e W < 0 se recebe trabalho do ambiente. Primeiro traduza os verbos do enunciado em sinais.'],
 ['As três perguntas possíveis','Se o gás recebe 800 J e faz 300 J de trabalho, ΔU = 800 − 300 = 500 J. Se ΔU = 500 J e W = 300 J, então Q = ΔU + W = 800 J. Se Q = 800 J e ΔU = 500 J, W = Q − ΔU = 300 J.'],
 ['Isocórica: W = 0','Em recipiente rígido, sem outros tipos de trabalho, ΔU = Q. Receber 400 J aumenta a energia interna em 400 J. Não há trabalho de fronteira, embora as partículas se movam mais rapidamente após o aquecimento.'],

function energyBalanceQuestion(q,{pick,medium,hard}){
  const family=q.family;let Q=pick([200,400,600,800,1000])*(medium?pick([-1,1]):1),W=pick([100,150,250,300])*(medium?pick([-1,1]):1),dU=Q-W,target=family==='cycle'?(medium?'Q':'dU'):family==='adiabatic'?pick(['dU','W']):medium?pick(['dU','Q','W']):'dU';
  if(family==='adiabatic'){Q=0;dU=-W;}if(family==='cycle'){Q=W;dU=0;}
  const energyGiven=(key,value)=>{const useKJ=hard;return given(q,key,useKJ?value/1000:value,useKJ?'kJ':'J')*(useKJ?1000:1);};
  if(family==='cycle'&&hard){
    const heatIn=given(q,'Qrecebido',pick([800,1000,1200,1600]),'J'),heatOut=given(q,'Qcedido',pick([200,300,400,600]),'J');Q=heatIn-heatOut;W=Q;target='W';
    q.params={Q,W,dU:0,target,heatIn,heatOut};q.prompt=`Durante um ciclo completo, um gás retorna ao estado inicial. Ao longo do ciclo, ele recebe ${fmt(heatIn)} J de calor e cede ${fmt(heatOut)} J. Qual é o trabalho líquido realizado pelo gás, em J?`;
    q.steps=['Em um ciclo completo, ΔU = 0.',`Calor líquido: Q = ${fmt(heatIn)} − ${fmt(heatOut)} = ${fmt(Q)} J.`,'Pela primeira lei, ΔU = Q − W. Assim, W = Q.',`W = ${fmt(W)} J.`];
  }else{
    if(family==='cycle'){
      if(target==='Q')W=energyGiven('W',W);Q=W;dU=0;
      q.prompt=target==='dU'?'Uma amostra de gás completa um ciclo termodinâmico e retorna exatamente ao estado inicial. Qual é a variação total da energia interna, em J?':`Um gás completa um ciclo e retorna ao mesmo estado inicial. O trabalho líquido realizado por ele é dado por ${q.givens.map(showGiven).join('')}. Calcule o calor líquido Q trocado, em J, adotando positivo o calor recebido.`;
    }else if(family==='adiabatic'){
      if(target==='dU'){W=energyGiven('W',W);dU=-W;}else{dU=energyGiven('ΔU',dU);W=-dU;}
      const info=target==='dU'?`o trabalho realizado pelo gás é dado por ${q.givens.map(showGiven).join('')}`:`a variação de energia interna é dada por ${q.givens.map(showGiven).join('')}`;
      q.prompt=`Uma amostra de gás sofre uma transformação adiabática, sem troca de calor. Nesse processo, ${info}. Determine ${target==='dU'?'ΔU':'W realizado pelo gás'}, em J. Adote W positivo quando realizado pelo gás.`;
    }else{
      if(target!=='Q')Q=energyGiven('Q',Q);if(target!=='W')W=energyGiven('W',W);if(target!=='dU')dU=energyGiven('ΔU',dU);
      if(target==='dU')dU=Q-W;if(target==='Q')Q=dU+W;if(target==='W')W=Q-dU;
      q.prompt=`Em um processo de uma amostra fechada de gás, ${q.givens.map(showGiven).join(' e ')}. Adote Q positivo para calor recebido e W positivo para trabalho realizado pelo gás. Determine ${target==='dU'?'a variação de energia interna ΔU':target==='Q'?'o calor Q trocado':'o trabalho W realizado pelo gás'}, em J.`;
    }
    q.params={Q,W,dU,target};q.steps=[...(q.givens.length?[knownStep(q)]:[]),...(hard?['Converta a energia dada em kJ para J, multiplicando por 1000.']:[]),...(family==='adiabatic'?['Adiabática: Q = 0, portanto ΔU = −W.']:family==='cycle'?['Ciclo completo: ΔU = 0, portanto Q líquido = W líquido.']:['Primeira lei: ΔU = Q − W. Para outras incógnitas: Q = ΔU + W e W = Q − ΔU.']),`${target==='dU'?'ΔU':target} = ${fmt({Q,W,dU}[target])} J.`];
  }
  q.answer=q.params[target];q.unit='J';q.quantity='energy';q.concept=family==='cycle'?'A energia interna depende do estado. Voltar ao mesmo estado implica ΔU total igual a zero.':family==='adiabatic'?'Sem transferência de calor, o trabalho determina a variação de energia interna com sinal oposto.':formulaById('first').why;

}
function unitQuestion(q,{pick,int}){

  if(variant==='volume'){given(q,'V',v,'L');q.answer=v/1000;q.unit='m³';q.quantity='volume';q.prompt=`Uma amostra ocupa ${fmt(v)} L. Qual é esse volume em m³? Use 1 L = 10⁻³ m³. Se necessário, responda em notação científica.`;q.steps=[`${fmt(v)} × 10⁻³ = ${fmt(q.answer)} m³.`];}

  q.concept='Converter unidades preserva a grandeza física. A mudança de origem entre Celsius e Kelvin só é aplicada a temperaturas absolutas.';
  return variant==='delta'?[{value:v+273.15,error:'Foi somado o deslocamento de escala a uma variação de temperatura.'}]:[];
}

function engineChoices(q,rng,suggestions=[]) {
  const numeric=typeof q.answer==='number';
  const makeChoice=(value,error='')=>({value:numeric?roundForDisplay(value):value,label:`${fmt(numeric?roundForDisplay(value):value)}${q.unit?' '+q.unit:''}`,error});
  const choices=[makeChoice(q.answer)];
  const pool=[...suggestions];
  if(numeric){
    const a=q.answer,step=Math.max(1,Math.abs(a)*.35);
    pool.push(...[a*2,a/2,a*1.5,a*.75,-a,a+step,a-step,a+2*step,a+3*step].map(value=>({value,error:'Confira a relação entre as grandezas, a operação e as unidades.'})));
  }
  for(const item of pool){
    if(choices.length===4)break;
    const c=makeChoice(item.value,item.error);
    if(numeric){
      if(!Number.isFinite(c.value))continue;
      if(['pressure','volume','temperature','amount','ratio'].includes(q.quantity)&&c.value<=0)continue;
      if(choices.some(other=>Math.abs(other.value-c.value)<=numericTolerance(other.value)+numericTolerance(c.value)))continue;
      if(checkAnswer(q,c.value).correct)continue;
    }
    if(choices.some(other=>String(other.value)===String(c.value)||other.label===c.label))continue;
    choices.push(c);
  }
  if(choices.length!==(q.family==='tf'?2:4))throw new Error('Não foi possível gerar alternativas distintas.');
  q.choices=shuffle(choices,rng);
}
/** Instância reproduzível. As grandezas fornecidas são as mesmas exibidas no enunciado. */
function generateQuestion(family='iso',level='facil',seed=Date.now().toString()+Math.random()) {
  const meta=FAMILIES.find(f=>f.id===family);
  if(!meta)throw new Error('Família de questões desconhecida.');
  if(!Object.hasOwn(LEVELS,level))throw new Error('Escolha Fácil, Médio ou Difícil.');
  const rng=seededRandom(`v2:${family}:${level}:${seed}`),pick=items=>items[Math.floor(rng()*items.length)],int=(a,b)=>a+Math.floor(rng()*(b-a+1));

  const wrong=populateQuestion(q,{rng,pick,int,shuffle:items=>shuffle(items,rng),medium:level!=='facil',hard:level==='dificil'});
  if(!q.prompt||(!Number.isFinite(q.answer)&&typeof q.answer!=='string'))throw new Error('Instância inválida.');
  if(!q.hints.length)q.hints=[`Observe o que o enunciado pede e quais dados ele fornece.`,`O conceito é ${meta.name.toLowerCase()}.`,`${formulaById(q.formulaId).equation}. Verifique as unidades antes de calcular.`];
  if(!q.choices)engineChoices(q,rng,wrong);

function chooseFamily({mode='balanced',focus=[],history=[],recent=[],bag=[]}={}) {
  const allowed=focus.length?FAMILIES.filter(f=>focus.includes(f.id)):FAMILIES.filter(f=>!['order','tf','mental'].includes(f.id));
  if(mode==='adaptive'){
    const weights=allowed.map(f=>{const a=history.filter(h=>h.family===f.id).slice(-12);return {id:f.id,w:a.length?1+4*(1-a.filter(x=>x.correct).length/a.length):3};});
    let t=Math.random()*weights.reduce((s,x)=>s+x.w,0);for(const x of weights){t-=x.w;if(t<=0)return {id:x.id,bag};}return {id:weights[0].id,bag};
  }
  const nextBag=bag.filter(id=>allowed.some(f=>f.id===id));
  if(!nextBag.length)nextBag.push(...shuffle(allowed.map(f=>f.id)));
  if(nextBag.length>1&&nextBag[0]===recent.at(-1))nextBag.push(nextBag.shift());
  return {id:nextBag.shift(),bag:nextBag};
}
function createExam({count=15,school=false,level='medio',focus=[],seed=Date.now().toString()}={}) {
  const rng=seededRandom(seed);let families=[];
  if(school)families=[...SCHOOL_FAMILIES];
  else {
    const candidates=FAMILIES.filter(f=>(!focus.length||focus.includes(f.id))&&!['mental','order','tf'].includes(f.id));
    if(!candidates.length)throw new Error('Escolha ao menos um conteúdo.');
    const groups=[1,2,3,4,5].map(m=>shuffle(candidates.filter(f=>f.module===m).map(f=>f.id),rng)).filter(a=>a.length);
    for(let i=0;i<count;i++){const g=groups[i%groups.length];families.push(g[Math.floor(i/groups.length)%g.length]);}
    families=shuffle(families,rng);
  }
  return families.map((f,i)=>{
    let q=generateQuestion(f,level,`${seed}-${i}`);
    if(!school&&f==='identify')for(let retry=0;q.module!==2&&retry<100;retry++)q=generateQuestion(f,level,`${seed}-${i}-recognition-${retry}`);
    return q;
  });
}
function diagnose(q,input) {
  const result=checkAnswer(q,input);if(result.correct)return '';
  const matching=q.choices?.find(c=>typeof c.value==='number'&&typeof result.value==='number'?Math.abs(c.value-result.value)<numericTolerance(c.value):String(c.value)===String(input));
  return matching?.error?`Hipótese a conferir: ${matching.error}`:'Não há evidência suficiente para identificar um erro específico. Confira interpretação, unidade, sinal e operação.';
}

function validateProgress(x){
  if(!x||x.version!==1||!Array.isArray(x.attempts)||!Array.isArray(x.studied)||!x.settings||!x.cards)throw new Error('Arquivo de progresso AERION inválido.');
  if(x.attempts.length>20000||JSON.stringify(x).length>20000000)throw new Error('Arquivo de progresso muito grande.');
  const base=defaultProgress(),out={...base,...x};
  out.attempts=x.attempts.filter(a=>a&&typeof a.id==='string'&&typeof a.family==='string'&&typeof a.correct==='boolean'&&Number.isFinite(a.at)&&Number.isFinite(a.seconds)&&a.seconds>=0&&Number.isFinite(a.hints)&&a.hints>=0);

  out.settings={...base.settings,...x.settings};out.settings.theme=out.settings.theme==='dark'?'dark':'light';out.settings.name=String(out.settings.name||'Explorador').slice(0,40);
  out.settings.scene=out.settings.scene==='2d'?'2d':'3d';out.settings.reduced=!!out.settings.reduced;

  for(const key of ['saved','exams','reviews','reviewFormulas'])if(!Array.isArray(out[key]))out[key]=[];
  out.saved=out.saved.filter(q=>q&&typeof q.id==='string'&&typeof q.prompt==='string'&&Array.isArray(q.steps)&&Array.isArray(q.choices)&&q.params&&q.hints&&typeof q.formulaId==='string'&&(Number.isFinite(q.answer)||typeof q.answer==='string'));
  out.exams=out.exams.filter(e=>e&&typeof e.id==='string'&&Array.isArray(e.questions)&&e.questions.length>0&&e.questions.length<=100&&Array.isArray(e.results)&&Number.isFinite(e.at));
  out.reviews=out.reviews.filter(r=>r&&typeof r.id==='string'&&Number.isFinite(r.at)&&Number.isFinite(r.box));
  if(!out.notes||typeof out.notes!=='object'||Array.isArray(out.notes))out.notes={};
  if(out.activeExam&&(!Array.isArray(out.activeExam.questions)||!out.activeExam.answers||!Number.isFinite(out.activeExam.startedAt)||out.activeExam.questions.length>100||out.activeExam.questions.some(q=>!q||!Array.isArray(q.choices)||!q.params||!Array.isArray(q.steps))))out.activeExam=null;
  // Compatibilidade com o antigo quarto nível, sem apagar provas, respostas ou pontos.
  const migrateLevel=item=>{if(item&&item.level==='especialista')item.level='dificil';};
  for(const attempt of out.attempts){
    if(attempt.level==='especialista'&&!Number.isFinite(attempt.earnedXp))attempt.earnedXp=attempt.correct?(attempt.hints?5:50):2;
    migrateLevel(attempt);migrateLevel(attempt.question);
  }
  out.saved.forEach(migrateLevel);
  for(const exam of [...out.exams,...(out.activeExam?[out.activeExam]:[])]){migrateLevel(exam);exam.questions.forEach(migrateLevel);}
  return out;
}

function setLabValue(key,value){

  const l=labState;

  }else{
    if(key==='V')return;l[key]=value;if(key==='T')l.P=idealSolve(l,'P');else if(key==='P')l.T=idealSolve(l,'T');
  }

function labPath(){
  const l=labState,b=l.base;

  });
}
function labCalculations(){

ica, lei geral, identificação, três sinais de trabalho, primeira lei, energia interna, recipiente rígido, ciclos, adiabática e aquecimento isobárico.</p><div class="divider"></div><div class="mini-stat"><span>Simulados concluídos</span><strong>${progress.exams.length}</strong></div><div class="mini-stat"><span>Melhor precisão</span><strong>${progress.exams.length?Math.max(...progress.exams.map(e=>pct(e.correct,e.questions.length)))+'%':'—'}</strong></div></section></div><section class="panel saved-section"><div class="panel-heading"><h2>Seu histórico</h2><span class="pill">${progress.exams.length} provas</span></div>${progress.exams.length?`<div class="table-scroll"><table><thead><tr><th>Data</th><th>Prova</th><th>Acertos</th><th>Tempo</th><th>Revisão</th></tr></thead><tbody>${[...progress.exams].reverse().map(e=>`<tr><td>${new Date(e.at).toLocaleString('pt-BR')}</td><td>${e.school?'Escolar':'Personalizado'} · ${e.questions.length} questões</td><td>${e.correct}/${e.questions.length} · ${pct(e.correct,e.questions.length)}%</td><td>${duration(e.seconds)}</td><td><a class="text-link" href="#/exams/${e.id}">Abrir ${icon('arrow',15)}</a></td></tr>`).join('')}</tbody></table></div>`:emptyState('Seu primeiro simulado começa aqui','Os resultados e as resoluções ficarão disponíveis após a entrega.')}</section>`;

function palacePage(){

',`formulas/${f.id}`,'ghost')}`:p.mode==='recall'?`<p>Qual equação você deixou neste lugar? Tente enxergar sua cena antes de escolher.</p><div class="answer-options">${recallChoices.map(c=>`<button class="answer-option" data-palace-answer="${c.id}" ${p.result?'disabled':''}>${esc(c.equation)}</button>`).join('')}</div>`:p.mode==='reconstruct'?`<p>Monte a equação associada a este marco. Toque nos símbolos na ordem.</p><div class="token-bank">${tokens.map(t=>`<button data-palace-token="${t.i}" class="math-token" ${p.tokens.includes(t.i)||p.result?'disabled':''}>${esc(t.value)}</button>`).join('')}</div><div class="token-answer">${p.tokens.map(i=>esc(f.tokens[i])).join(' ')||'Sua equação aparecerá aqui'}</div><div class="button-row">${button('Verificar equação','check-reconstruction','primary')}${button('Limpar','clear-reconstruction','ghost')}</div>`:p.mode==='spatial'?`<p>Feche os olhos por alguns segundos. Visite mentalmente este lugar e recupere a equação e sua condição.</p>${p.revealed?`${equationMarkup(f,true)}<p>${f.memory}</p>`:button('Revelar associação','reveal-locus','primary')}<p class="caption">Percorra os marcos na ordem. Depois experimente fazer o caminho de volta.</p>`:`<p>Use o mapa à esquerda. As equações permanecem escondidas até sua escolha.</p><p class="caption">A localização escolhida será comparada à condição física do problema.</p>`}${p.result?`<div class="feedback ${p.result.correct?'success':'failure'}"><strong>${p.result.correct?'Associação recuperada.':'Reforce esta conexão.'}</strong><p>${target.locus} → ${esc(target.equation)}</p><p>${target.memory}</p></div>`:''}<div class="palace-controls">${button('← Anterior','palace-previous','ghost')}${button(p.mode==='identify'?'Novo desafio':'Próximo local '+icon('arrow',17),'palace-next','primary')}</div></section></div><p class="caption">O percurso visual usa perspectiva CSS. Nas configurações, alterne para a versão plana em 2D. Personalize uma cena forte, visualize-a e teste sua recordação sem o function renderApp(){
  clearInterval(appTimer);stopParticles();if(progress.activeExam&&ui.examEntered&&route().page==='exams'&&route().id==='run')flushExamTime();applySettings();const {page,id}=route();let content;
  try{
    if(page==='dashboard')content=dashboardPage();else if(page==='academy')content=academyPage(id);else if(page==='formulas')content=formulasPage(id);else if(['arena','radar','mental'].includes(page))content=arenaPage(page);else if(page==='lab')content=renderLabPage();else if(page==='exams')content=examsPage(id);else if(page==='errors')content=errorsPage();else if(page==='stats')content=statsPage();else if(page==='palace')content=palacePage();else if(page==='flashcards')content=flashcardsPage();else if(page==='settings')content=settingsPage();else content=dashboardPage();
    root.innerHTML=shell(page,content);
    if(page==='lab'){updateLab();startParticles(progress.settings.reduced||matchMedia('(prefers-reduced-motion: reduce)').matches);}
    installPageTimer();
  }catch(error){console.error(error);root.innerHTML=shell(page,emptyState('O laboratório encontrou um imprevisto','Seus dados salvos continuam disponíveis. Volte à central e tente abrir esta área novamente.',linkButton('Voltar à central','dashboard')));}

function installPageTimer(){
  const {page,id}=route();
  if(page==='exams'&&id==='run'&&progress.activeExam){
    const tick=()=>{const e=progress.activeExam;if(!e)return;const now=Date.now(),remaining=e.deadline?Math.max(0,(e.deadline-now)/1000):(now-e.startedAt)/1000;const el=document.getElementById('exam-clock');if(el)el.textContent=`${e.deadline?'Restam ':'Decorrido '}${duration(remaining)}`;if(e.deadline&&now>=e.deadline){clearInterval(appTimer);completeExam(true);}};
    tick();appTimer=setInterval(tick,1000);
  }else if(page==='radar'&&ui.source==='radar'&&ui.arena.started&&ui.arena.limit&&!ui.arena.result){
    const tick=()=>{const s=ui.arena,left=Math.max(0,Math.ceil(s.limit-(Date.now()-s.questionStartedAt)/1000)),el=document.getElementById('radar-countdown');if(el)el.textContent=left?`${left} s`:'Tempo de referência encerrado · continue sem penalização';if(!left)clearInterval(appTimer);};tick();appTimer=setInterval(tick,250);
  }
}
function startTraining(source,options={}){
  const focus=options.focus??[...document.querySelectorAll('input[name="train-focus"]:checked')].map(x=>x.value),mode=options.mode??document.getElementById('train-mode')?.value??'balanced';
  if(mode==='focused'&&!focus.length&&source==='arena'){toast('Selecione ao menos um conteúdo para o treino focado.');return;}
  const limitValue=document.getElementById('radar-time')?.value,limit=limitValue==='custom'?Math.min(600,Math.max(5,Number(document.getElementById('radar-custom').value)||45)):Number(limitValue)||0;
  ui.source=source;ui.arena={...ui.arena,started:true,q:null,focus,mode,level:options.level??document.getElementById('train-level')?.value??'facil',answerMode:options.answerMode??document.getElementById('train-answer')?.value??(source==='mental'?'numeric':'choice'),bag:[],recent:[],signatures:[],sessionIds:[],limit,max:options.max||0};
  nextQuestion(options.family);if(route().page!==source)go(source);
}
function nextQuestion(forcedFamily){
  const s=ui.arena;if(s.max&&s.sessionIds.length>=s.max){s.started=false;renderApp();toast('Revisão de cinco questões concluída. Consulte a evolução nas estatísticas.');return;}
  let family=forcedFamily;
  if(ui.source==='radar')family='identify';else if(ui.source==='mental')family='mental';
  if(!family){const selected=chooseFamily({mode:s.mode,focus:s.focus,history:progress.attempts,recent:s.recent,bag:s.bag});family=selected.id;s.bag=selected.bag;}
  if(ui.source==='arena'&&s.answerMode==='mixed'&&!s.focus.length&&Math.random()<.18)family=Math.random()<.5?'order':'tf';
  let q=generateQuestion(family,s.level,newSeed());
  if(ui.source==='radar'&&s.mode==='adaptive'){
    const candidates=MAIN_FORMULAS.map(f=>({id:f.id,weight:1+progress.attempts.filter(a=>a.formulaId===f.id&&!a.correct).slice(-10).length}));let r=Math.random()*candidates.reduce((n,c)=>n+c.weight,0),target=candidates.at(-1).id;
    for(const c of candidates){r-=c.weight;if(r<=0){target=c.id;break;}}
    for(let i=0;i<80&&q.formulaId!==target;i++)q=generateQuestion('identify',s.level,newSeed());
  }
  s.signatures=s.signatures||[];for(let retry=0;s.signatures.includes(q.signature)&&retry<30;retry++)q=generateQuestion(family,s.level,newSeed());s.signatures.push(q.signature);s.signatures=s.signatures.slice(-30);
  s.recent.push(q.family);s.recent=s.recent.slice(-25);Object.assign(s,{q,result:null,firstResult:undefined,input:'',hints:0,showFormula:false,showSolution:false,message:'',order:[],numericThis:s.answerMode==='mixed'&&Math.random()<.5,questionStartedAt:Date.now()});renderApp();
}
function answerQuestion(){
  const s=ui.arena,q=s.q;if(!q||s.result)return;
  if(q.kind==='order'){if(s.order.length!==q.choices.length){s.message='Organize todas as etapas antes de responder.';renderApp();return;}s.input=s.order.map(i=>q.choices[i].value).join(' → ');}
  else if(document.getElementById('numeric-answer'))s.input=document.getElementById('numeric-answer').value.trim();
  if(s.input===''||s.input===undefined){s.message='Escolha uma alternativa ou digite sua resposta.';renderApp();return;}
  const result=checkAnswer(q,s.input);if(!result.valid){s.message=result.error||'Confira a resposta.';renderApp();return;}
  const added=addAttempt(progress,q,s.input,result,{seconds:(Date.now()-s.questionStartedAt)/1000,hints:s.hints+(s.showFormula?1:0)+(s.showSolution?1:0),source:ui.source});
  if(!added)s.firstResult=progress.attempts.find(a=>a.id===q.id)?.correct;
  if(added&&!s.sessionIds.includes(q.id))s.sessionIds.push(q.id);s.result=result;s.message='';persist();renderApp();
}
function flushExamTime(){const e=progress.activeExam;if(!e||!ui.examEntered)return;const q=e.questions[ui.examIndex];e.times=e.times||{};e.times[q.id]=(e.times[q.id]||0)+(Date.now()-ui.examEntered)/1000;ui.examEntered=Date.now();}
function saveExamInput(){
  const e=progress.activeExam;if(!e)return true;const input=document.getElementById('numeric-answer');if(!input)return true;
  const q=e.questions[ui.examIndex],value=input.value.trim();if(!value){delete e.answers[q.id];return true;}
  const parsed=checkAnswer(q,value);if(!parsed.valid){toast(parsed.error||'Confira o número digitado.');return false;}e.answers[q.id]=value;persist();return true;
}
function startExam(){
  if(progress.activeExam){go('exams/run');return;}
  const structure=document.getElementById('exam-structure').value,school=structure==='school',focus=structure==='focused'?[...document.querySelectorAll('input[name="exam-focus"]:checked')].map(x=>x.value):[];

  const count=school?15:Math.min(60,Math.max(5,Math.round(Number(document.getElementById('exam-count').value)||15))),minutes=Math.min(240,Math.max(0,Number(document.getElementById('exam-minutes').value)||0)),level=document.getElementById('exam-level').value,seed=newSeed();
  progress.activeExam={id:`prova-${seed}`,questions:createExam({count,school,focus,level,seed}),answers:{},times:{},school,level,startedAt:Date.now(),deadline:minutes?Date.now()+minutes*60000:null,answerMode:document.getElementById('exam-answer-mode').value};ui.examIndex=0;persist();go('exams/run');
}
function askFinishExam(){if(!saveExamInput())return;const e=progress.activeExam,blanks=e.questions.filter(q=>e.answers[q.id]===undefined).length;showDialog('Entregar o simulado?',blanks?`Há ${blanks} questões em branco. Elas serão registradas como incorretas na correção.`:'Todas as questões têm uma resposta. Após a entrega, você poderá revisar a resolução completa.','Entregar agora','confirm-finish-exam');}

}

  if(['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName)){if(event.key==='Enter'&&event.target.id==='numeric-answer'){event.preventDefault();if(route().page==='exams'){if(saveExamInput()){renderApp();toast('Resposta salva.');}}else answerQuestion();}return;}
  if(event.key==='Escape'&&ui.menu){ui.menu=false;renderApp();}
  if(event.code==='Space'&&route().page==='flashcards'){event.preventDefault();ui.cardBack=!ui.cardBack;renderApp();}
  if(event.key.toLowerCase()==='n'&&ui.arena.started&&ui.arena.result&&['arena','radar','mental'].includes(route().page))nextQuestion();
  if(event.key==='Enter'&&event.target.hasAttribute('data-point')){event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
window.addEventListener('hashchange',()=>{if(progress.activeExam&&ui.examEntered){flushExamTime();persist();ui.examEntered=0;}ui.menu=false;renderApp();window.scrollTo({top:0,behavior:'instant'});});
window.addEventListener('beforeunload',()=>{if(progress.activeExam){saveExamInput();flushExamTime();persist();}});
window.addEventListener('online',()=>{const e=document.getElementById('connection-status');if(e)e.textContent='Progresso local';});
window.addEventListener('offline',()=>{const e=document.getElementById('connection-status');if(e)e.textContent='Modo offline';});
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();window.aerionInstallPrompt=event;});
if(!progress.settings.reduced&&matchMedia('(prefers-reduced-motion: reduce)').matches)progress.settings.reduced=true;
renderApp();
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});


})();</script>
</body>
</html>
